<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · ASSH HRMS</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0f3f6b;color:#eaf2fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px}
    .box{max-width:340px;text-align:center}
    img{width:120px;height:120px;background:#fff;border-radius:24px;padding:10px;box-sizing:border-box}
    h1{font-size:20px;margin:20px 0 8px}
    p{color:#bcd4ec;font-size:14px;line-height:1.5;margin:0 0 20px}
    button{background:#137fc4;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:600}
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/icons/icon-192.png" alt="ASSH">
    <h1>You're offline</h1>
    <p>ASSH HRMS needs a connection to the hospital network to load live roster,
       attendance and payroll data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
